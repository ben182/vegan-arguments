name: Fehler auf einer Karte melden
description: Eine Zahl stimmt nicht, eine Quelle ist veraltet oder eine Antwort ist missverständlich.
title: "Fehler: "
labels: ["fehler"]
body:
  - type: input
    id: karte
    attributes:
      label: Welche Karte?
      description: Die Kennung aus dem Link, z. B. soja-regenwald
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Was stimmt nicht?
      placeholder: z. B. „Die Zahl 77 % ist veraltet, neuere Daten zeigen …“
    validations:
      required: true
  - type: input
    id: quelle
    attributes:
      label: Quelle (falls vorhanden)
      description: Link zu einer Studie oder Fachstelle, die deine Korrektur belegt
