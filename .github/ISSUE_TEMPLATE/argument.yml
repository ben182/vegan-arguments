name: Suggest a new argument
description: An argument against veganism you hear a lot that is still missing here.
title: "Argument: "
labels: ["suggestion"]
body:
  - type: input
    id: argument
    attributes:
      label: What is the argument?
      description: The way people actually say it at the dinner table
      placeholder: e.g. "Vegans use plastic too"
    validations:
      required: true
  - type: textarea
    id: antwort
    attributes:
      label: Your answer to it (optional)
  - type: input
    id: quelle
    attributes:
      label: Sources (optional)
