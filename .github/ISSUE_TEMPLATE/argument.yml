name: Neues Argument vorschlagen
description: Ein Argument gegen Veganismus, das dir oft begegnet und das hier noch fehlt.
title: "Argument: "
labels: ["vorschlag"]
body:
  - type: input
    id: argument
    attributes:
      label: Wie lautet das Argument?
      description: So, wie man es am Tisch hört
      placeholder: z. B. „Veganer brauchen doch auch Plastik“
    validations:
      required: true
  - type: textarea
    id: antwort
    attributes:
      label: Deine Antwort darauf (optional)
  - type: input
    id: quelle
    attributes:
      label: Quellen (optional)
