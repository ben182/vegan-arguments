name: Quellen prüfen

on:
  schedule:
    - cron: "0 6 1 * *" # am 1. jedes Monats, 6 Uhr UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Links prüfen
        id: pruefen
        run: |
          set +e
          node scripts/quellen-pruefen.mjs > bericht.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat bericht.txt
      - name: Issue anlegen, wenn Links kaputt sind
        if: steps.pruefen.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titel="Kaputte Quellen-Links ($(date +%Y-%m))"
          {
            echo "Der monatliche Linkcheck hat kaputte Quellen gefunden:"
            echo
            echo '```'
            cat bericht.txt
            echo '```'
          } > text.md
          gh label create quellen --color FBCA04 --description "Quellen und Belege" 2>/dev/null || true
          gh issue create --title "$titel" --body-file text.md --label quellen
